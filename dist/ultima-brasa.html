:root{
  --void:#0a0708;--soot:#14100f;--char:#221916;--umber:#3a241b;--rust:#8c3b1c;--rustLight:#c2562a;
  --ember:#ff7a2a;--glow:#ffb347;--flame:#ffd98a;--hot:#fff2c8;--ash:#b9ada0;--bone:#e9dcc6;--toxic:#42e0b4;--blood:#c0322a;
}
*{-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--bone);overflow:hidden;font-family:'Rajdhani',sans-serif}
#app{position:fixed;inset:0}

/* ───── Forja de Efeitos ───── */
.fj{position:absolute;inset:0;display:grid;grid-template-columns:372px minmax(420px,1fr) 340px;grid-template-rows:54px 1fr;background:#0a0708;color:var(--bone);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;overflow:hidden;z-index:50}
.fj *{box-sizing:border-box}
.fj-head{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #2a1f1b;background:linear-gradient(#1a1311,#110c0b)}
.fj-logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--ember);text-shadow:0 0 18px rgba(255,122,42,.55);margin-right:8px}
.fj-logo small{font-size:13px;color:var(--ash);letter-spacing:3px;margin-left:8px;text-shadow:none}
.fj select,.fj input[type=text],.fj button{font:inherit;color:var(--bone);background:#1d1513;border:1px solid #3a2a24;border-radius:6px;padding:5px 9px;outline:none}
.fj select:focus,.fj input[type=text]:focus{border-color:var(--ember)}
.fj button{cursor:pointer;transition:.12s;letter-spacing:.4px}
.fj button:hover{background:#2a1d18;border-color:var(--rustLight)}
.fj button.pri{background:linear-gradient(#c2562a,#8c3b1c);border-color:#e0703a;color:#fff2c8}
.fj button.pri:hover{filter:brightness(1.15)}
.fj button.on{background:#3a2218;border-color:var(--ember);color:var(--flame);box-shadow:0 0 10px rgba(255,122,42,.25) inset}
.fj button.sm{padding:3px 8px;font-size:12px}
.fj .sp{flex:1}
.fj .saved{font-size:12px;color:var(--toxic);opacity:0;transition:opacity .4s}
.fj .saved.show{opacity:1}
.fj-left,.fj-right{overflow-y:auto;background:#110c0b;padding:12px;display:flex;flex-direction:column;gap:10px}
.fj-left{border-right:1px solid #2a1f1b}.fj-right{border-left:1px solid #2a1f1b}
.fj-left::-webkit-scrollbar,.fj-right::-webkit-scrollbar{width:8px}
.fj-left::-webkit-scrollbar-thumb,.fj-right::-webkit-scrollbar-thumb{background:#3a2a24;border-radius:4px}
.fj-title{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:16px;color:var(--glow);margin:2px 0 0}
.fj-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fj-tabs{display:flex;gap:4px}.fj-tabs button{flex:1}
.fj-canvaswrap{position:relative;border:1px solid #3a2a24;border-radius:8px;overflow:hidden;background:#0c0808;line-height:0;box-shadow:0 0 30px rgba(0,0,0,.6) inset}
.fj-canvaswrap canvas{width:100%;aspect-ratio:1;cursor:crosshair;touch-action:none;display:block}
.fj-sw{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.fj-sw i{aspect-ratio:1;border-radius:5px;border:2px solid #2a1f1b;cursor:pointer;display:block}
.fj-sw i.sel{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.4)}
.fj-fld{display:grid;grid-template-columns:118px 1fr 46px;align-items:center;gap:8px;min-height:24px}
.fj-fld label{color:var(--ash);font-size:13px}
.fj-fld input[type=range]{width:100%;accent-color:var(--ember);height:18px}
.fj-fld output{font-size:12px;color:var(--flame);text-align:right;font-variant-numeric:tabular-nums}
.fj-fld.wide{grid-template-columns:118px 1fr}
.fj-fld input[type=color]{width:100%;height:26px;border:1px solid #3a2a24;border-radius:5px;background:none;padding:0}
.fj-sec{border:1px solid #2a1f1b;border-radius:8px;background:#150f0e;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
.fj-sec>h4{margin:0 0 2px;font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1.5px;color:var(--glow);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.fj-sec>h4 .sw{margin-left:auto;font-family:'Rajdhani';font-size:12px;color:var(--ash);letter-spacing:0}
.fj-sec.off>:not(h4){display:none}
.fj-sec.off>h4{opacity:.55}
.fj-center{display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at 50% 40%,#1a1210,#0a0708)}
.fj-stagewrap{flex:1;position:relative;min-height:0}
.fj-stagewrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.fj-hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ash);opacity:.8;pointer-events:none;text-shadow:0 1px 3px #000}
.fj-trans{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #2a1f1b;background:#110c0b;flex-wrap:wrap}
.fj-trans label{color:var(--ash);font-size:13px;display:flex;align-items:center;gap:5px}
.fj-trans input[type=range]{accent-color:var(--ember)}
.fj-bind{display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;font-size:12px;color:var(--ash)}
.fj-bind select{width:100%;padding:3px 5px;font-size:12px}
.fj-note{font-size:12px;color:var(--ash);line-height:1.35;font-weight:500}
.fj-toast{position:absolute;right:16px;bottom:16px;background:#2a1d18;border:1px solid var(--ember);padding:8px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:70}
.fj-toast.show{opacity:1;transform:none}

.fj-fld.wide input[type=text],.fj-fld.wide select{width:100%;min-width:0}

/* ───── Última Brasa — interface do jogo ───── */
.g-stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#0a0708}
.g-ui{position:absolute;inset:0;pointer-events:none;font-family:'Rajdhani',sans-serif;font-weight:600;color:var(--bone);user-select:none;-webkit-user-select:none}
.g-ui *{box-sizing:border-box}
.g-ui button{font:inherit;color:var(--bone);cursor:pointer;pointer-events:auto}
.dim{color:var(--ash);opacity:.75}
.g{color:var(--glow)}
.g-logo{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:3px;color:var(--ember);text-shadow:0 0 22px rgba(255,122,42,.55),0 2px 0 #3a1208;line-height:1;white-space:nowrap}
.g-logo small{display:block;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:5px;color:var(--ash);text-shadow:none;margin-top:3px;text-transform:uppercase}
.g-logo.big{font-size:72px;text-align:center}
.g-loading{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#1c1411,#0a0708);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;pointer-events:auto;z-index:20}
.g-bar{width:min(340px,70vw);height:8px;background:#1a1210;border:1px solid #3a2a24;border-radius:6px;overflow:hidden}
.g-bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rust),var(--ember),var(--flame));box-shadow:0 0 14px var(--ember);transition:width .2s}
.g-loadtxt{font-size:13px;letter-spacing:3px;color:var(--ash);text-transform:uppercase}

/* botões */
.g-btn{background:linear-gradient(#2a1d18,#1d1513);border:1px solid #4a3329;border-radius:8px;padding:8px 14px;letter-spacing:.6px;transition:.12s;text-transform:none}
.g-btn:hover:not(:disabled){background:linear-gradient(#3a271e,#2a1d18);border-color:var(--rustLight);transform:translateY(-1px)}
.g-btn:active:not(:disabled){transform:translateY(0)}
.g-btn:disabled{opacity:.4;cursor:not-allowed}
.g-btn.sm{padding:5px 11px;font-size:14px}
.g-btn.on{background:#3a2218;border-color:var(--ember);color:var(--flame)}
.g-btn.off{opacity:.55}
.g-btn.go{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:5px;padding:12px 20px;color:var(--hot);background:linear-gradient(#d4602a,#8c3b1c);border:1px solid #ff9a54;box-shadow:0 0 28px rgba(255,122,42,.4),inset 0 1px 0 rgba(255,255,255,.3);width:100%;border-radius:10px;text-shadow:0 2px 0 rgba(60,20,8,.7)}
.g-btn.go:hover:not(:disabled){filter:brightness(1.15);box-shadow:0 0 40px rgba(255,122,42,.65),inset 0 1px 0 rgba(255,255,255,.3)}
.g-btn.go.sm2{font-size:24px;letter-spacing:3px;padding:9px 18px;width:auto}

/* painéis */
.g-panel{pointer-events:auto;background:linear-gradient(180deg,rgba(28,20,17,.9),rgba(14,10,9,.93));border:1px solid #3a2a24;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,170,110,.08);backdrop-filter:blur(6px);display:flex;flex-direction:column;min-height:0}
.g-panel h2{margin:0;padding:14px 18px 10px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:26px;letter-spacing:3px;color:var(--flame);border-bottom:1px solid #2a1f1b}
.g-panel h2 small{display:block;font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:1.5px;color:var(--ash);margin-top:2px;font-weight:600}

/* abrigo */
.g-hub{position:absolute;inset:0;display:grid;grid-template-columns:372px 1fr 372px;grid-template-rows:auto 1fr;gap:0 18px;padding:16px 18px 18px;pointer-events:none;transition:opacity .35s,transform .35s}
.g-hub.under{visibility:hidden}
.g-hub.off{opacity:0;transform:scale(1.02);visibility:hidden}
.h-top{grid-column:1/4;display:flex;align-items:center;gap:12px;padding-bottom:14px}
.h-sp{flex:1}
.h-scrap{pointer-events:auto;display:flex;align-items:baseline;gap:8px;background:rgba(18,13,11,.88);border:1px solid #4a3329;border-radius:10px;padding:6px 16px;font-size:26px;font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px;color:var(--glow);box-shadow:0 0 22px rgba(255,122,42,.12)}
.h-scrap .ic{color:#9fb0bc;font-size:22px}
.h-scrap small{font-family:'Rajdhani',sans-serif;font-size:13px;color:var(--toxic);letter-spacing:.5px;min-width:0}
.h-tabs{display:none}
.h-surv{grid-column:1;grid-row:2;overflow:auto}
.h-exp{grid-column:3;grid-row:2;padding-bottom:16px}
.h-list{overflow:auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin;scrollbar-color:#4a3329 transparent}
.h-up{display:flex;align-items:center;gap:10px;background:rgba(34,25,22,.7);border:1px solid #2e211c;border-radius:10px;padding:8px 10px 8px 12px;transition:.15s}
.h-up.can{border-color:#6a4030;background:rgba(48,32,25,.8);box-shadow:0 0 16px rgba(255,122,42,.1)}
.h-up.max{opacity:.7}
.h-upi{flex:1;min-width:0}
.h-upn{font-size:17px;color:var(--bone);line-height:1.1}
.h-upn em{font-style:normal;font-size:13px;color:var(--ash)}
.h-upd{font-size:12.5px;color:var(--ash);line-height:1.2;margin-top:1px}
.h-upv{font-size:13px;color:var(--glow);margin-top:3px}
.h-upv span{color:var(--toxic)}
.h-buy{min-width:84px;padding:7px 8px;font-size:15px;color:var(--glow);background:#1d1513;border:1px solid #4a3329;border-radius:8px;text-align:center}
.h-buy:not(:disabled):hover{background:#3a2218;border-color:var(--ember);color:var(--hot)}
.h-up.can .h-buy{border-color:var(--rustLight);box-shadow:0 0 12px rgba(255,122,42,.25) inset}
.h-buy.done{color:var(--ash);border-style:dashed;pointer-events:none}
.h-sub{padding:12px 18px 6px;font-size:12px;letter-spacing:2.5px;color:var(--ash);text-transform:uppercase}
.h-relics{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:0 16px}
.h-relic{position:relative;aspect-ratio:1;padding:0;border-radius:11px;background:radial-gradient(circle at 50% 40%,#2a1d18,#140e0c);border:1px solid #3a2a24;overflow:hidden;transition:.15s}
.h-relic:hover{border-color:var(--rustLight);transform:translateY(-2px)}
.h-relic.sel{border-color:var(--ember);box-shadow:0 0 18px rgba(255,122,42,.55),inset 0 0 14px rgba(255,122,42,.25)}
.h-relic .ic{width:100%;height:100%;display:block}
.h-relic.lock .ic{filter:grayscale(1) brightness(.5)}
.h-relic .lk{position:absolute;left:0;right:0;bottom:2px;font-size:10.5px;color:var(--glow);text-shadow:0 1px 2px #000;text-align:center}
.h-skname{padding:10px 18px 0;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px}
.h-skdesc{padding:0 18px;font-size:14px;color:var(--ash);min-height:36px;line-height:1.25}
.h-depth{display:flex;align-items:center;gap:10px;padding:0 16px}
.h-dv{flex:1;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--bone)}
.h-dv b{font-weight:400;color:var(--ember)}
.h-depthinfo{padding:6px 18px 14px;font-size:13.5px;color:var(--ash);line-height:1.4}
.h-depthinfo b{color:var(--bone)}
.h-depthinfo b.g{color:var(--glow)}
.h-exp>.g-btn.go{margin:6px 16px 0;width:calc(100% - 32px)}
.h-stats{margin:14px 16px 0;padding-top:10px;border-top:1px solid #2a1f1b;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13.5px}
.h-stats>div{display:flex;justify-content:space-between;color:var(--ash)}
.h-stats b{color:var(--bone)}

/* HUD */
.g-hud{position:absolute;inset:0;display:none}
.g-hud.on{display:block}
.r-xp{position:absolute;left:0;right:0;top:0;height:7px;background:rgba(10,7,8,.7)}
.r-xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#127a66,var(--toxic));box-shadow:0 0 12px var(--toxic)}
.r-hp{position:absolute;left:16px;top:20px;width:min(300px,46vw)}
.g-bar.hp{width:100%;height:20px;position:relative;border-radius:5px;border-color:#5a2a22;background:#1a0d0b}
.g-bar.hp>i{background:linear-gradient(90deg,#8c1f18,#e0432a);box-shadow:0 0 12px rgba(224,67,42,.6);transition:width .12s}
.g-bar.hp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;text-shadow:0 1px 2px #000;letter-spacing:1px}
.r-lvl{margin-top:4px;font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:2px;color:var(--toxic)}
.r-lvl b{font-weight:400;color:var(--hot)}
.r-mid{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center}
.r-time{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:3px;line-height:1;color:var(--hot);text-shadow:0 0 20px rgba(255,122,42,.6),0 2px 0 #000}
.r-sub{font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--ash);min-height:16px}
.r-boss{display:none;margin-top:6px;min-width:min(440px,60vw)}
.r-boss.on{display:block}
.r-boss span{font-family:'Bebas Neue',sans-serif;letter-spacing:4px;font-size:20px;color:#ff6a4a}
.r-boss .g-bar{width:100%;height:12px;border-color:#6a2a22}
.r-boss .g-bar>i{background:linear-gradient(90deg,#7a1810,#ff5a3a);box-shadow:0 0 14px #ff4a2a}
.r-right{position:absolute;right:14px;top:18px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.r-kv{font-size:15px;color:var(--ash);letter-spacing:1px}
.r-kv b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:24px;color:var(--bone);letter-spacing:1.5px}
.r-kv.s b{color:var(--glow)}
.r-pause{margin-top:6px;width:42px}
.r-slots{position:absolute;left:14px;bottom:14px;display:flex;gap:8px}
.r-slot{position:relative;width:54px;height:54px;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2a1d18,#140e0c);border:1px solid color-mix(in srgb,var(--c) 55%,#3a2a24);overflow:hidden;box-shadow:0 0 14px color-mix(in srgb,var(--c) 22%,transparent)}
.r-slot .ic{width:100%;height:100%;display:block}
.r-slot .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(8,5,5,.66)}
.r-slot b{position:absolute;right:3px;bottom:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:17px;color:var(--hot);text-shadow:0 1px 2px #000,0 0 6px #000}
.r-dash{position:absolute;right:16px;bottom:22px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#3a2a24,#150f0d);border:2px solid #5a3a2c;overflow:hidden;color:var(--ash);opacity:.9}
.r-dash b{position:relative;z-index:1;font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:2px;font-size:19px}
.r-dash i{position:absolute;left:0;right:0;bottom:0;background:rgba(8,5,5,.72)}
.r-dash.rdy{border-color:var(--ember);color:var(--hot);box-shadow:0 0 18px rgba(255,122,42,.4)}
.r-joy{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,170,110,.35);background:rgba(255,122,42,.07);opacity:0;pointer-events:none;transition:opacity .15s}
.r-joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,160,90,.5);border:2px solid rgba(255,200,140,.7)}

/* avisos */
.g-banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:7px;color:#ff7a4a;text-shadow:0 0 30px rgba(255,80,30,.8),0 3px 0 #000;opacity:0;white-space:nowrap}
.g-banner.show{animation:ban 2s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translateX(-50%) scale(1.5)}12%{opacity:1;transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.g-toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(20,14,12,.96);border:1px solid #6a4030;border-radius:10px;padding:10px 18px;opacity:0;transition:.3s;font-size:15px;max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.g-toast.show{opacity:1;transform:translate(-50%,0)}

/* sobreposições */
.g-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 45%,rgba(20,12,9,.72),rgba(5,3,3,.9));pointer-events:auto;backdrop-filter:blur(3px);padding:20px;overflow:auto}
.g-overlay.show{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.lv-title{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:6px;color:var(--flame);text-shadow:0 0 28px rgba(255,150,60,.6)}
.lv-title b{color:var(--toxic);font-weight:400}
.lv-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.lv-card{position:relative;width:236px;padding:20px 18px 18px;text-align:center;background:linear-gradient(180deg,#241a16,#130e0c);border:1px solid color-mix(in srgb,var(--c) 45%,#3a2a24);border-radius:16px;transition:.16s;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:card .35s ease-out backwards}
.lv-card:nth-child(2){animation-delay:.06s}.lv-card:nth-child(3){animation-delay:.12s}
@keyframes card{from{opacity:0;transform:translateY(24px) scale(.95)}}
.lv-card:hover{transform:translateY(-8px);border-color:var(--c);box-shadow:0 18px 50px rgba(0,0,0,.7),0 0 36px color-mix(in srgb,var(--c) 40%,transparent)}
.lv-card .ic{width:96px;height:96px;display:block;margin:0 auto 6px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,#140e0c),#140e0c 70%)}
.lv-card .ic.glyph{display:flex;align-items:center;justify-content:center;font-size:46px;color:var(--c);text-shadow:0 0 18px var(--c)}
.lv-card h3{min-height:60px;display:flex;align-items:center;justify-content:center;line-height:.95;margin:6px 0 8px;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:28px;letter-spacing:2px;color:var(--bone)}
.lv-card p{margin:10px 0 0;font-size:15px;color:var(--ash);line-height:1.3;min-height:58px}
.lv-card .k{position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:6px;border:1px solid #4a3329;color:var(--ash);font-size:14px;line-height:22px}
.lv-card .tag{position:absolute;right:12px;top:12px;font-size:11px;letter-spacing:2px;padding:2px 8px;border-radius:5px;background:var(--toxic);color:#04241c;font-weight:700}
.lv-card .tag.u{background:var(--ember);color:#3a1208}.lv-card .tag.p{background:#4a3329;color:var(--bone)}
.pips{display:flex;gap:5px;justify-content:center}
.pips i{width:16px;height:6px;border-radius:3px;background:#2a1f1b}
.pips i.on{background:var(--c)}.pips i.new{background:var(--hot);box-shadow:0 0 8px var(--c)}
.lv-foot{display:flex;gap:16px;align-items:center}
.pause h2{margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:64px;letter-spacing:8px;color:var(--flame)}
.ps-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.result .rs-card{width:min(560px,94vw);padding:28px 30px 26px;background:linear-gradient(180deg,#241a16,#110c0a);border:1px solid #5a3a2c;border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.75);text-align:center;animation:card .4s ease-out}
.result .rs-card.win{border-color:var(--glow);box-shadow:0 20px 70px rgba(0,0,0,.75),0 0 60px rgba(255,170,70,.3)}
.rs-t{font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:6px;color:var(--ember);text-shadow:0 0 26px rgba(255,122,42,.5);line-height:1}
.win .rs-t{color:var(--flame)}
.rs-s{color:var(--ash);letter-spacing:2px;margin:6px 0 20px;text-transform:uppercase;font-size:13px}
.rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-bottom:20px}
.rs-grid>div{display:flex;justify-content:space-between;padding:8px 12px;background:rgba(40,28,23,.6);border-radius:8px;font-size:15px}
.rs-grid span{color:var(--ash)}
.rs-gain{font-size:18px;color:var(--ash);margin-bottom:6px}
.rs-gain b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:40px;letter-spacing:2px;margin-left:8px;vertical-align:-4px}
.rs-unlock{color:var(--toxic);font-size:16px;letter-spacing:1px;margin:6px 0}
.rs-btns{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* Forja embutida */
.g-forja{position:absolute;inset:0;z-index:100;background:#0a0708;pointer-events:auto}
.g-forja .fj{z-index:101}
.g-forjaback{position:absolute;z-index:200;right:208px;top:9px;pointer-events:auto;background:linear-gradient(#d4602a,#8c3b1c)!important;border:1px solid #ff9a54!important;color:var(--hot);font-size:14px;padding:6px 14px;border-radius:7px}

/* responsivo */
@media (max-width:1060px){
  .g-hub{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;padding:10px 10px 10px;gap:8px}
  .h-top{grid-column:1;padding-bottom:0;flex-wrap:wrap}
  .g-logo{font-size:26px}.g-logo small{display:none}
  .h-tabs{display:flex;gap:8px;pointer-events:auto}
  .h-surv,.h-exp{grid-column:1;grid-row:3;display:none;align-self:end;max-height:62vh}
  .g-hub[data-tab="surv"] .h-surv,.g-hub[data-tab="exp"] .h-exp{display:flex}
  .h-scrap{font-size:20px;padding:4px 12px}
  .g-btn.go{font-size:28px}
}
@media (max-width:700px){
  .r-time{font-size:34px}.r-hp{top:16px}.r-right{top:14px}
  .r-slots{bottom:112px;gap:5px}.r-slot{width:44px;height:44px}
  .lv-card{width:100%;max-width:340px;padding:12px 14px;display:grid;grid-template-columns:70px 1fr;text-align:left;gap:0 12px}
  .lv-card .ic{grid-row:1/4;width:70px;height:70px;margin:0}.lv-card h3{margin:0;font-size:24px;min-height:0;justify-content:flex-start}.lv-card p{min-height:0;margin:4px 0 0}.lv-card .pips{justify-content:flex-start}
  .lv-title{font-size:32px}.lv-cards{gap:10px}.g-banner{font-size:30px;letter-spacing:4px}
  .g-forjaback{right:auto;left:8px;top:auto;bottom:8px}
}

/* ===== Hub: sobrevivente / mapas ===== */
.h-exp{overflow:auto;scrollbar-width:thin;scrollbar-color:#4a3329 transparent}
.h-rankbox{padding:14px 18px 4px}
.h-rank{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:3px;color:var(--bone)}
.h-rank b{color:var(--glow);font-weight:400;font-size:40px}
.h-rankbox .g-bar{width:100%}
.h-ranksub{font-size:13px;color:var(--ash);margin-top:6px}
.h-cinzas{display:flex;gap:10px;align-items:baseline;padding:10px 18px 0;font-size:15px;color:var(--ash)}
.h-cinzas b{color:#ffd9a0;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;font-weight:400}
.h-cinzas em{font-style:normal;color:var(--toxic);font-size:13px}
.dim{color:var(--ash);font-size:13px;opacity:.85}
.h-actions{display:flex;flex-direction:column;gap:10px;padding:16px 16px 0}
.g-btn.tb{font-size:26px;display:flex;align-items:center;justify-content:center;gap:12px;letter-spacing:4px}
.g-btn.tb .badge{font-family:'Rajdhani',sans-serif;font-size:12px;letter-spacing:1px;background:var(--toxic);color:#04241c;border-radius:10px;padding:2px 9px}
.h-maps{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.h-map{text-align:left;padding:9px 11px;border-radius:10px;background:linear-gradient(180deg,#221915,#130e0c);border:1px solid #3a2a24;border-left:4px solid var(--c);display:flex;flex-direction:column;gap:1px;transition:.15s}
.h-map b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:19px;letter-spacing:1.5px;color:var(--bone);line-height:1}
.h-map small{font-size:11.5px;color:var(--ash);line-height:1.15}
.h-map em{font-style:normal;font-size:11px;color:var(--c);margin-top:2px}
.h-map:hover{border-color:var(--c)}
.h-map.sel{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 16px color-mix(in srgb,var(--c) 18%,transparent)}
.h-map.lock{opacity:.5;filter:grayscale(.7)}
/* ===== Marcos ===== */
.ms-card{width:min(560px,94vw);max-height:90vh;overflow:auto;padding:22px 24px;background:linear-gradient(180deg,#241a16,#110c0a);border:1px solid #5a3a2c;border-radius:16px;display:flex;flex-direction:column;gap:10px}
.ms-card h2{margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:38px;letter-spacing:5px;color:var(--flame)}
.ms-list{display:flex;flex-direction:column;gap:7px}
.ms-row{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:9px;background:rgba(40,28,23,.6);border:1px solid #2e211c}
.ms-row.done{opacity:.55;border-color:#2a4a3a}
.ms-i{flex:1;display:flex;flex-direction:column;gap:2px}.ms-i b{font-size:16px;color:var(--bone)}.ms-i span{font-size:12.5px;color:var(--ash)}
.ms-i .g-bar{width:100%;height:5px;margin-top:3px}
.ms-r{text-align:right;color:var(--glow);font-size:15px;min-width:76px}.ms-r small{display:block;color:var(--ash);font-size:11.5px}
/* ===== Árvore da Brasa ===== */
.g-tree{position:absolute;inset:0;display:none;flex-direction:column;background:radial-gradient(circle at 50% 50%,#1c130f,#0b0708 75%);pointer-events:auto;z-index:50}
.g-tree.show{display:flex;animation:fadein .25s}
.t-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #2a1f1b;background:rgba(14,10,9,.85);z-index:3;flex-wrap:wrap}
.t-view{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(rgba(255,150,80,.07) 1px,transparent 1px);background-size:34px 34px}
.t-view:active{cursor:grabbing}
.t-world{position:absolute;left:0;top:0;width:3200px;height:2800px;transform-origin:0 0}
.t-edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.t-edges line{stroke:#2e211c;stroke-width:4;stroke-linecap:round}
.t-edges line.open{stroke:#5a4034;stroke-dasharray:2 9}
.t-edges line.lit{stroke:var(--c);stroke-width:5;filter:drop-shadow(0 0 5px var(--c))}
.t-root{position:absolute;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#4a2414,#1a0f0b);border:2px solid var(--ember);box-shadow:0 0 36px rgba(255,122,42,.6);font-size:30px;pointer-events:none}
.t-root span{font-size:11px;letter-spacing:2px;color:var(--glow);text-transform:uppercase}
.t-node{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;padding:0;background:radial-gradient(circle at 50% 35%,#2c211c,#130d0b);border:3px solid #3a2a24;color:#6a5850;font-size:28px;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.t-node .g{filter:grayscale(1);opacity:.45;line-height:1}
.t-node .lv{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11.5px;background:#0e0a09;border:1px solid #3a2a24;border-radius:8px;padding:0 6px;color:var(--ash);white-space:nowrap}
.t-node .lv:empty{display:none}
.t-node:not(.locked){border-color:color-mix(in srgb,var(--c) 55%,#3a2a24);color:var(--c)}
.t-node:not(.locked) .g{filter:none;opacity:.9;text-shadow:0 0 12px var(--c)}
.t-node.bought{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 55%,transparent),0 4px 14px rgba(0,0,0,.6)}
.t-node.bought .g{opacity:1}.t-node.bought .lv{color:var(--c);border-color:var(--c)}
.t-node.max{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--c) 40%,#2c211c),#130d0b)}
.t-node.can{animation:canpulse 1.6s ease-in-out infinite}
@keyframes canpulse{50%{box-shadow:0 0 28px var(--c),0 0 6px var(--c) inset}}
.t-node:hover{transform:translate(-50%,-50%) scale(1.1)}
.t-node.sel{transform:translate(-50%,-50%) scale(1.18);border-color:#fff;z-index:2}
.t-node.pop{animation:nodepop .4s}
@keyframes nodepop{40%{transform:translate(-50%,-50%) scale(1.35);filter:brightness(1.8)}}
.t-label{position:absolute;transform:translate(-50%,-50%);font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:10px;opacity:.28;pointer-events:none;white-space:nowrap}
.t-detail{position:absolute;right:16px;bottom:16px;width:min(340px,calc(100% - 32px));display:none;flex-direction:column;gap:8px;padding:14px 16px;background:linear-gradient(180deg,rgba(32,23,19,.97),rgba(14,10,9,.98));border:1px solid var(--c);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.7),0 0 26px color-mix(in srgb,var(--c) 30%,transparent);z-index:4}
.t-detail.show{display:flex}
.t-detail p{margin:0;font-size:14.5px;color:var(--bone);line-height:1.3}
.d-top{display:flex;align-items:center;gap:12px}
.d-ico{font-size:30px;color:var(--c);width:48px;height:48px;border-radius:50%;border:2px solid var(--c);display:flex;align-items:center;justify-content:center}
.d-name{flex:1;display:flex;flex-direction:column}.d-name b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:24px;letter-spacing:2px}.d-name small{color:var(--ash);font-size:12px}
.d-eff{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ash)}.d-eff b{color:var(--bone)}.d-eff b.nx,.d-eff .g{color:var(--toxic)}
.d-req{color:#ff8a6a;font-size:13px}
.d-buy{display:flex;gap:8px;align-items:center}.d-buy .go.sm2{flex:1;font-size:20px;padding:7px 10px}
.t-rebirth{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);display:none;flex-direction:column;gap:8px;padding:20px 22px;background:linear-gradient(180deg,#2a1a14,#120c0a);border:1px solid #ffb347;border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.8),0 0 50px rgba(255,150,60,.25);z-index:6}
.t-rebirth.show{display:flex}
.t-rebirth h3{margin:0;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:34px;letter-spacing:5px;color:var(--flame)}
.t-rebirth p{margin:0;font-size:14px;color:var(--ash);line-height:1.3}
.rb-row{display:flex;justify-content:space-between;font-size:16px}.rb-row .g{color:#ffd9a0}
.rb-btns{display:flex;gap:10px;margin-top:6px}
.g-btn.pri{border-color:var(--ember);color:var(--flame)}
/* HUD extra */
.r-combo{position:absolute;right:16px;top:150px;display:none;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;color:var(--flame);text-shadow:0 0 14px rgba(255,122,42,.7)}
.r-combo.on{display:block}.r-combo .cbar{height:4px;background:#1a1210;border-radius:3px;margin-top:2px;overflow:hidden}.r-combo .cbar i{display:block;height:100%;background:var(--ember)}
.r-tide{display:none;margin-top:4px;font-family:'Bebas Neue',sans-serif;letter-spacing:5px;font-size:20px;color:var(--toxic);text-shadow:0 0 14px var(--toxic);animation:canpulse 1s infinite}
.r-tide.on{display:block}
@media (max-width:700px){.t-label{font-size:22px;letter-spacing:6px}.r-combo{top:120px;font-size:22px}.t-node{width:58px;height:58px}.h-maps{grid-template-columns:1fr 1fr}}

/* ===== Menu inicial ===== */
.g-title{position:absolute;inset:0;display:none;pointer-events:none;z-index:20;background:linear-gradient(90deg,rgba(7,4,4,.94) 0%,rgba(7,4,4,.78) 30%,rgba(7,4,4,.25) 58%,transparent 80%),radial-gradient(ellipse at 20% 100%,rgba(255,90,20,.18),transparent 60%)}
.g-title.show{display:block;animation:ttin .7s ease-out}
@keyframes ttin{from{opacity:0}to{opacity:1}}
.tt-embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tt-side{position:absolute;left:clamp(24px,6vw,96px);top:50%;transform:translateY(-50%);width:min(440px,calc(100% - 48px));display:flex;flex-direction:column;gap:0}
.tt-kicker{font-size:12px;letter-spacing:4px;white-space:nowrap;text-transform:uppercase;color:var(--ash);animation:ttup .8s .15s both}
.tt-logo{margin:6px 0 0;font-family:'Bebas Neue',sans-serif;font-weight:400;line-height:.82;display:flex;flex-direction:column}
.tt-logo .a{font-size:clamp(54px,8.4vw,112px);letter-spacing:.06em;color:#f3e3cf;text-shadow:0 3px 0 #3a1208,0 0 38px rgba(255,150,70,.35);animation:ttup .9s .25s both}
.tt-logo .b{font-size:clamp(88px,14.6vw,190px);letter-spacing:.04em;background:linear-gradient(180deg,#fff2c8 5%,#ffb347 32%,#ff6a1c 62%,#a8260c 100%);background-size:100% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,100,30,.55)) drop-shadow(0 4px 0 rgba(60,16,6,.8));animation:ttup 1s .4s both,flame 3.2s ease-in-out infinite}
@keyframes flame{0%,100%{background-position:0 0;filter:drop-shadow(0 0 22px rgba(255,100,30,.5)) drop-shadow(0 4px 0 rgba(60,16,6,.8))}50%{background-position:0 25%;filter:drop-shadow(0 0 40px rgba(255,130,40,.8)) drop-shadow(0 4px 0 rgba(60,16,6,.8))}}
.tt-tag{margin:10px 0 26px;font-size:17px;letter-spacing:2px;color:#d9b99a;font-style:italic;animation:ttup .9s .6s both}
@keyframes ttup{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none}}
.tt-menu{display:flex;flex-direction:column;gap:8px}
.tt-btn{pointer-events:auto;position:relative;text-align:left;padding:11px 20px 11px 22px;border-radius:10px;background:linear-gradient(90deg,rgba(40,27,22,.82),rgba(20,13,11,.35));border:1px solid rgba(90,60,46,.55);border-left:4px solid #5a3a2c;display:flex;flex-direction:column;gap:1px;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;animation:ttslide .6s both;overflow:hidden}
.tt-btn:nth-child(1){animation-delay:.7s}.tt-btn:nth-child(2){animation-delay:.8s}.tt-btn:nth-child(3){animation-delay:.9s}
@keyframes ttslide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.tt-btn b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:30px;letter-spacing:4px;color:var(--bone);line-height:1.05}
.tt-btn small{font-size:13px;color:var(--ash);letter-spacing:.5px;min-height:15px}
.tt-btn.main{padding:14px 22px;border-left-color:var(--ember);background:linear-gradient(90deg,rgba(180,70,28,.55),rgba(60,26,16,.35))}
.tt-btn.main b{font-size:42px;color:#fff2d8;text-shadow:0 0 22px rgba(255,150,60,.7)}
.tt-btn::after{content:'›';position:absolute;right:18px;top:50%;transform:translate(-8px,-52%);font-size:34px;color:var(--flame);opacity:0;transition:.15s}
.tt-btn.foc,.tt-btn:hover{transform:translateX(10px);border-color:var(--ember);border-left-color:var(--flame);background:linear-gradient(90deg,rgba(210,92,36,.62),rgba(60,26,16,.45));box-shadow:0 0 30px rgba(255,110,40,.32)}
.tt-btn.foc::after,.tt-btn:hover::after{opacity:1;transform:translate(0,-52%)}
.tt-btn.foc b,.tt-btn:hover b{color:#fff6e4}
.tt-secs{display:flex;gap:8px;margin-top:14px;animation:ttup .8s 1.05s both}
.tt-sec{pointer-events:auto;flex:1;padding:8px 6px;border-radius:8px;font-size:15px;letter-spacing:1px;background:rgba(24,16,13,.7);border:1px solid #3a2a24;color:var(--ash);transition:.15s}
.tt-sec.foc,.tt-sec:hover{color:var(--flame);border-color:var(--ember);background:rgba(60,30,20,.8)}
.tt-stat{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--ash);letter-spacing:1px;animation:ttup .8s 1.2s both}
.tt-stat b{color:var(--glow);font-weight:600}
.tt-foot{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;padding:0 clamp(24px,6vw,96px);font-size:12px;letter-spacing:3px;color:#7a6659}
/* diálogos / opções */
.ms-card.dlg{width:min(520px,94vw)}
.dlg-foot{display:flex;justify-content:flex-end;margin-top:8px}
.op-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 4px;border-bottom:1px solid #2a1f1b}
.op-row b{display:block;font-size:17px;color:var(--bone)}.op-row small{display:block;font-size:12.5px;color:var(--ash);font-weight:500}
.op-seg{display:flex;gap:6px}
.sw{position:relative;flex:none;width:52px;height:28px;border-radius:14px;background:#1a1210;border:1px solid #4a3329;padding:0;transition:.2s}
.sw i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#6a5850;transition:.2s}
.sw.on{background:#5a2a14;border-color:var(--ember)}.sw.on i{left:27px;background:var(--flame);box-shadow:0 0 12px var(--ember)}
.g-btn.danger{border-color:#7a2a22;color:#ff8a6a}
.hp-row{display:flex;gap:14px;align-items:center;padding:6px 0;font-size:15px;color:var(--bone)}
.kbd{flex:none;min-width:118px;text-align:center;padding:3px 8px;border-radius:6px;background:#1a1210;border:1px solid #4a3329;border-bottom-width:3px;color:var(--flame);font-size:14px}
.hp-p{margin:6px 0;font-size:15px;line-height:1.35;color:#d9c9ba;font-weight:500}.hp-p b{color:var(--flame)}
@media (max-width:820px){
  .g-title{background:linear-gradient(0deg,rgba(7,4,4,.94) 0%,rgba(7,4,4,.7) 42%,rgba(7,4,4,0) 75%)}
  .tt-side{left:50%;top:auto;bottom:18px;transform:translateX(-50%);width:min(440px,calc(100% - 28px))}
  .tt-logo{align-items:center}.tt-kicker,.tt-tag{text-align:center}

  .tt-tag{margin:6px 0 12px;font-size:14px}.tt-btn b{font-size:24px}.tt-btn.main b{font-size:32px}.tt-btn{padding:8px 16px}.tt-btn.main{padding:10px 18px}.tt-btn small{display:none}

}
@media (max-height:560px) and (min-width:821px){.tt-tag{margin-bottom:12px}.tt-btn small{display:none}.tt-btn b{font-size:24px}.tt-btn.main b{font-size:32px}.tt-logo .b{font-size:clamp(70px,22vh,150px)}}
.g-overlay.ms{z-index:70}
.g-overlay.lv,.g-overlay.pause,.g-overlay.result{z-index:60}

.g-banner{top:18%;text-align:center;font-size:56px;line-height:1;pointer-events:none}
.g-banner b{display:block;font-weight:400}
.g-banner small{display:block;margin-top:8px;font-family:'Rajdhani',sans-serif;font-size:16px;letter-spacing:6px;color:#ffd9a0;text-shadow:0 2px 0 #000;text-transform:uppercase}
@media (max-width:700px){.g-banner{font-size:34px;letter-spacing:4px;white-space:normal;width:92vw}.g-banner small{font-size:12px;letter-spacing:3px}}

.t-node .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:13px;font-size:12px;letter-spacing:.5px;color:#7a6659;white-space:nowrap;text-shadow:0 1px 3px #000;pointer-events:none}
.t-node:not(.locked) .nm{color:var(--bone)}.t-node.bought .nm{color:var(--c)}
.rs-grid>div{animation:rsin .5s both}
@keyframes rsin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rs-grid>div.rec{background:rgba(90,48,20,.7);box-shadow:inset 0 0 0 1px var(--ember)}
.rs-grid em{font-style:normal;font-size:10px;letter-spacing:1.5px;margin-left:8px;padding:1px 6px;border-radius:5px;background:var(--glow);color:#3a1a06;vertical-align:2px}
.result .rs-card{animation:rscard .6s cubic-bezier(.2,1.2,.3,1) both}
@keyframes rscard{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.t-node.sel .nm{color:#fff}

.t-node.hidden{opacity:.55;filter:grayscale(1)}.t-node.hidden .g{opacity:.5;font-size:24px}.t-node.hidden .nm{color:#4a3d36}
.t-node.key{width:80px;height:80px;border-radius:24px}
.t-node.key:not(.locked){border-width:4px}.t-node.key.bought{box-shadow:0 0 30px color-mix(in srgb,var(--c) 75%,transparent),0 4px 14px rgba(0,0,0,.6)}
.lv-card .tag.x{background:var(--c);color:#120c0a;font-weight:700}

.h-diff:hover{border-color:var(--c);color:var(--bone)}.h-diff.on{background:color-mix(in srgb,var(--c) 22%,#1a1311);border-color:var(--c);color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
